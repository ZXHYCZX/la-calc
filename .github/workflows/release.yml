name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i
      - run: node scripts/build-web.js
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist/*.zip }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Android cmdline-tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: sdkmanager "platforms;android-30" "build-tools;34.0.0" > /dev/null
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i
      - run: node la-app/build-apk.js
      - run: mv la-app/out/la-calc.apk la-calc-android-${GITHUB_REF_NAME}.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: la-calc-android-*.apk }

  desktop:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: win }
          - { os: ubuntu-latest, target: linux }
          - { os: macos-latest, target: mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i
      - run: node scripts/build-web.js
      - run: node -e "fs.cpSync('dist/web','electron/web',{recursive:true})"
      - run: npm i --prefix electron
      - run: npx --prefix electron electron-builder --${{ matrix.target }} --publish never
        working-directory: electron
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.dmg

  release:
    needs: [web, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: |
          mkdir -p rel
          find artifacts -type f \( -name "*.zip" -o -name "*.apk" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.dmg" \) -exec cp {} rel/ \;
          ls -la rel
      - run: gh release create "$GITHUB_REF_NAME" rel/* --title "LA Calc $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
